name: Publish verified npm and GitHub release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version; must match package.json'
        required: false
        default: ''
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: publish-qwen-dap-mcp-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Validate release version, ancestry and existing GitHub tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Release commit must be reachable from main.'; exit 1; }
          node -e "const p=require('./package.json'),q=require('./qwen-extension.json'),l=require('./package-lock.json'),r=require('./server.json');if(p.version!==q.version||p.version!==l.version||p.version!==l.packages[''].version||p.version!==r.version||r.packages?.[0]?.version!==p.version||r.packages?.[0]?.identifier!==p.name||r.name!==p.mcpName||p.mcpName!=='io.github.spk-c/qwen-dap-mcp'||p.private!==false||p.name!=='@slp-dev1/qwen-dap-mcp'||!(/^[0-9]+[.][0-9]+[.][0-9]+(?:-[0-9A-Za-z.-]+)?$/).test(p.version))process.exit(1)"
          VERSION=$(node -p 'require("./package.json").version')
          test -z "$REQUESTED_VERSION" || test "$REQUESTED_VERSION" = "$VERSION" || { echo 'Requested version differs from package.json.'; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION" || { echo 'Tag must match package version.'; exit 1; }
          else
            test "$GITHUB_REF" = refs/heads/main || { echo 'Manual releases must run from main.'; exit 1; }
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists; refusing to overwrite."; exit 1; fi
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" || { echo 'Tag points to another commit.'; exit 1; }
          fi
      - name: Require successful CI, native debuggers, postmortem, remote and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > /tmp/qwen-dap-ci.json
          for workflow in \
            "CI" "Native debugger end-to-end" "Native postmortem E2E" \
            "Loopback GDB remote E2E" "Windows CodeLLDB minidump E2E" "CodeQL" "macOS native compatibility (experimental)" "Real CLI MCP registration"; do
            conclusion=$(jq -r --arg name "$workflow" '[.workflow_runs[] | select(.name == $name) | .conclusion] | .[0] // "missing"' /tmp/qwen-dap-ci.json)
            printf '%s: %s\n' "$workflow" "$conclusion"
            test "$conclusion" = success || { echo "Missing successful required workflow: $workflow"; exit 1; }
          done
      - name: Reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full verification
        run: npm run check
      - name: Actual archive integrity check
        run: npm run check:pack
      - name: Build release archive and SHA256 manifest
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          cd release-assets
          sha256sum ./*.tgz > SHA256SUMS
      - name: Install npm with OIDC trusted publishing support
        run: npm install --global npm@^11
      - name: Install official MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz' \
            --output /tmp/mcp-publisher.tar.gz
          echo '00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  /tmp/mcp-publisher.tar.gz' | sha256sum --check
          mkdir -p /tmp/mcp-publisher-cli
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp/mcp-publisher-cli mcp-publisher
          echo '/tmp/mcp-publisher-cli' >> "$GITHUB_PATH"
      - name: Validate MCP Registry metadata before npm publication
        shell: bash
        run: |
          set -euo pipefail
          mcp-publisher validate server.json
      - name: Publish verified tarball or safely resume a partial release
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find release-assets -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$archive"
          existing=$(npm view "@slp-dev1/qwen-dap-mcp@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
          if [ -n "$existing" ]; then
            local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            test "$existing" = "$local_integrity" || { echo 'Existing npm tarball differs; refusing overwrite.'; exit 1; }
            echo 'Verified identical npm tarball; continuing with GitHub release recovery.'
          else
            # npm Trusted Publishing generates provenance automatically, without an explicit --provenance.
            publish_log=$(mktemp)
            if npm publish "./$archive" --access public --ignore-scripts 2>&1 | tee "$publish_log"; then
              echo 'Published with npm Trusted Publishing.'
            else
              if ! grep -q 'TLOG_CREATE_ENTRY_ERROR' "$publish_log" || ! grep -q 'equivalent entry already exists' "$publish_log"; then
                echo 'npm publish failed for a reason other than an existing Sigstore log entry.'
                exit 1
              fi
              # A failed attestation can occur after the registry has already accepted the artifact.
              existing_after=$(npm view "@slp-dev1/qwen-dap-mcp@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
              if [ -n "$existing_after" ]; then
                local_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
                test "$existing_after" = "$local_integrity" || { echo 'Registry accepted a different tarball; refusing to continue.'; exit 1; }
                echo 'npm already accepted the identical tarball; continuing.'
              else
                echo '::warning::Sigstore returned a duplicate transparency-log entry. Falling back to OIDC trusted publishing without a provenance attestation.'
                echo 'npm provenance exception: Sigstore transparency log returned a duplicate-entry HTTP 409. This release used npm Trusted Publishing with provenance disabled for the retry.' >> "$GITHUB_STEP_SUMMARY"
                npm publish "./$archive" --access public --provenance=false --ignore-scripts
              fi
            fi
            rm -f "$publish_log"
          fi
      - name: Confirm npm package is available for MCP Registry verification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            published=$(npm view "@slp-dev1/qwen-dap-mcp@$RELEASE_VERSION" version 2>/dev/null || true)
            if [ "$published" = "$RELEASE_VERSION" ]; then exit 0; fi
            echo "Waiting for npm registry package visibility ($attempt/18)"
            sleep 10
          done
          echo 'npm package is not visible; refusing MCP Registry registration.'
          exit 1
      - name: Publish verified package metadata to official MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          mcp-publisher validate server.json
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
      - name: Tag vetted commit and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Qwen DAP MCP $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" release-assets/*.tgz release-assets/SHA256SUMS \
            --verify-tag --title "Qwen DAP MCP $RELEASE_VERSION" \
            --generate-notes --latest
