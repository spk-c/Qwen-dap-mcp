name: Real CLI MCP registration
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  claude-codex:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install and build the MCP server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Install pinned official Claude Code and Codex CLIs
        run: npm install --global --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@2.1.316 @openai/codex@0.166.0
      - name: Register and inspect MCP in real CLI executables without account credentials
        shell: bash
        env:
          CI: '1'
          DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          export CODEX_HOME="$(mktemp -d)"
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          trap 'rm -rf "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"' EXIT
          server="$GITHUB_WORKSPACE/dist/index.js"
          test -f "$server"
          claude --version
          codex --version
          claude mcp add --transport stdio --scope user qwen-dap-mcp -- node "$server"
          claude mcp get qwen-dap-mcp | tee /tmp/claude-mcp-get.txt
          grep -F 'qwen-dap-mcp' /tmp/claude-mcp-get.txt
          # Claude's list command also attempts a real local stdio connection.
          claude mcp list | tee /tmp/claude-mcp-list.txt
          grep -F 'qwen-dap-mcp' /tmp/claude-mcp-list.txt
          codex mcp add qwen-dap-mcp -- node "$server"
          codex mcp get qwen-dap-mcp --json | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{const x=JSON.parse(b); if(x.transport?.stdio?.command!=="node" && x.command!=="node")process.exit(1);})'
          codex mcp list --json | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{const x=JSON.parse(b); if(!JSON.stringify(x).includes("qwen-dap-mcp"))process.exit(1);})'
      - name: Verify cross-client MCP protocol handshake separately
        run: npm run test:clients
