name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Emit generated dependency lockfile for review
        if: runner.os == 'Linux' && matrix.node == 22
        run: node -e "const fs=require('node:fs'); console.log('LOCKFILE_BEGIN'+fs.readFileSync('package-lock.json').toString('base64')+'LOCKFILE_END')"
      - run: npm run check
      - name: Verify committed build is synchronized
        run: git diff --exit-code -- dist
